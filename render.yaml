services:
  - type: web
    name: talent-careers-ats
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@enter.in
      - key: ADMIN_DEFAULT_PASSWORD
        value: adminpassword123
